<text x="871.75" y="114" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D64545">雪崩！190V → 0.21V</text>
<text x="871.75" y="132" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6770">峰值 3.8A / 500ns</text>
<text x="110" y="352" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6770">V(t) = V_T·(1 − e^(−t/τ))，τ = R·C = 47kΩ × 10nF</text>
<rect x="90" y="430" width="810" height="46" rx="8" fill="#F7F9FB" stroke="#D6DEE5"/>
<text x="106" y="450" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2933">周期 10ms = 20.8τ ✅ 每次都充满；旧版 1kHz 只有 2.1τ，T 节点塌到 ≈135V</text>
<text x="106" y="468" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6770">放电走「ZTX415 + 50Ω」，不是 47kΩ；47kΩ 上游接着电源，只负责慢慢灌。</text>
