<rect x="300" y="756" width="14" height="12" fill="#7B5BD6"/><text x="320" y="767" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">触发</text>
<rect x="380" y="756" width="14" height="12" fill="#1E9E6A"/><text x="400" y="767" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">雪崩输出</text>
<rect x="490" y="756" width="14" height="12" fill="#8A98A3"/><text x="510" y="767" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">GND</text>
<text x="590" y="767" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">● 实心圆点 = 相连；本图已做到零交叉，交叉即不相连的规则不再需要</text>

<text x="60" y="794" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">共地：所有接地符号必须用导线汇到同一点 —— 12V 适配器负极（高压模块 / NE555 / 所有阻容 / 50Ω 全在这里）。</text>
<text x="60" y="816" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">本轮 V0：XL6009、UF4007 不接；Ct 用 104（≈102Hz）；47kΩ/3W 两端压降是验源判据（静态 ≈1V → 雪崩 ≈10V）。</text>
<text x="60" y="838" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">安全：红表笔插 VΩ 孔（插 A 孔量 200–250V = 直接短路）；单手操作；鳄鱼夹先夹稳再上电；禁止用螺丝刀短路放电。</text>

