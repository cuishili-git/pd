<!-- ============ 底部说明 ============ -->
<rect x="40" y="740" width="1200" height="112" rx="10" fill="#F7F9FB" stroke="#D6DEE5" stroke-width="1.5"/>
<rect x="60" y="756" width="14" height="12" fill="#D64545"/><text x="80" y="767" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">高压</text>
