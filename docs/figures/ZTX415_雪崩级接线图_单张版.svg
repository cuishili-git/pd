<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
<rect x="0" y="0" width="1400" height="1000" fill="#FFFFFF"/>

<defs>
<g id="gnd" stroke="#5B6770" stroke-width="2" fill="none" stroke-linecap="round">
<line x1="-14" y1="0" x2="14" y2="0"/>
<line x1="-9" y1="5" x2="9" y2="5"/>
<line x1="-4" y1="10" x2="4" y2="10"/>
</g>
</defs>

<text x="700" y="46" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F2933">ZTX415 雪崩级 · 接线图（单张版）</text>
<text x="700" y="74" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6770">200–250V ｜ 12V 适配器直供 ｜ NE555 ≈100Hz（Ct=104）｜ 全图零交叉，● 实心圆点 = 相连</text>

<!-- ========== 顶部：高压充电级 ========== -->
<rect x="60" y="140" width="170" height="68" rx="8" fill="#FFFFFF" stroke="#E8871A" stroke-width="2"/>
<text x="145" y="170" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2933">12V 适配器</text>
<text x="145" y="192" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">本轮不用 XL6009</text>
<line x1="230" y1="174" x2="270" y2="174" stroke="#E8871A" stroke-width="2.5"/>

<rect x="270" y="140" width="240" height="68" rx="8" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<text x="390" y="168" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2933">45–390V 升压模块</text>
<text x="390" y="190" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">空载调 200V 起步 · 250V 封顶</text>
<line x1="510" y1="174" x2="545" y2="174" stroke="#D64545" stroke-width="2.5"/>

<rect x="545" y="160" width="70" height="28" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<text x="580" y="212" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">47kΩ / 3W 限流</text>
<line x1="615" y1="174" x2="660" y2="174" stroke="#D64545" stroke-width="2.5"/>
<circle cx="660" cy="174" r="4.5" fill="#D64545"/>
<line x1="660" y1="174" x2="960" y2="174" stroke="#D64545" stroke-width="2.5"/>
<text x="672" y="152" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B03030">T 节点 200–250V</text>

<!-- 10nF 储能支路 -->
<circle cx="740" cy="174" r="3.5" fill="#D64545"/>
<line x1="740" y1="174" x2="740" y2="240" stroke="#D64545" stroke-width="2"/>
<line x1="726" y1="240" x2="754" y2="240" stroke="#D64545" stroke-width="3" stroke-linecap="round"/>
<line x1="726" y1="252" x2="754" y2="252" stroke="#D64545" stroke-width="3" stroke-linecap="round"/>
<line x1="740" y1="252" x2="740" y2="290" stroke="#D64545" stroke-width="2"/>
<use href="#gnd" x="740" y="290"/>
<text x="740" y="325" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">10nF / 1kV (103)</text>
<text x="740" y="343" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">储能</text>

<!-- 10MΩ 泄放支路 -->
<circle cx="840" cy="174" r="3.5" fill="#D64545"/>
<line x1="840" y1="174" x2="840" y2="225" stroke="#D64545" stroke-width="2"/>
<rect x="828" y="225" width="24" height="50" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="840" y1="275" x2="840" y2="290" stroke="#D64545" stroke-width="2"/>
<use href="#gnd" x="840" y="290"/>
<text x="840" y="325" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">10MΩ / 1W</text>
<text x="840" y="343" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">泄放（常接）</text>

<!-- C 引线 -->
<line x1="960" y1="174" x2="960" y2="350" stroke="#D64545" stroke-width="2.5"/>
<text x="948" y="340" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#D64545">C</text>

<!-- ========== 中央：ZTX415 ========== -->
<rect x="880" y="350" width="240" height="160" rx="8" fill="#FFFFFF" stroke="#1D5FA8" stroke-width="2"/>
<text x="1000" y="402" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">ZTX415</text>
<text x="1000" y="430" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5B6770">雪崩 NPN · E-Line 封装</text>
<text x="1000" y="456" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">实物脚位：左 C · 中 B · 右 E</text>
<text x="1000" y="478" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">对应引脚 1 / 2 / 3</text>

<!-- B 引线（低位绕行） -->
<line x1="560" y1="445" x2="880" y2="445" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="560" y1="445" x2="560" y2="605" stroke="#7B5BD6" stroke-width="2.5"/>
<text x="868" y="450" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#7B5BD6">B</text>
<text x="700" y="435" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#7B5BD6">触发线（12V 尖峰，与高压线拉开距离）</text>

<!-- E 引线与输出 -->
<line x1="1120" y1="400" x2="1230" y2="400" stroke="#1E9E6A" stroke-width="2.5"/>
<text x="1132" y="405" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E9E6A">E</text>
<circle cx="1230" cy="400" r="4.5" fill="#1E9E6A"/>
<line x1="1230" y1="400" x2="1230" y2="470" stroke="#1E9E6A" stroke-width="2"/>
<rect x="1218" y="470" width="24" height="56" fill="#FFFFFF" stroke="#1E9E6A" stroke-width="2"/>
<line x1="1230" y1="526" x2="1230" y2="550" stroke="#1E9E6A" stroke-width="2"/>
<use href="#gnd" x="1230" y="550"/>
<text x="1206" y="502" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">50Ω 负载</text>
<polyline points="1230,400 1280,355 1320,345" fill="none" stroke="#1E9E6A" stroke-width="2.5" stroke-linejoin="round"/>
<text x="1340" y="378" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E9E6A">≈10cm 硬导线（天线）</text>

<!-- ========== 左下：触发链 ========== -->
<rect x="60" y="560" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#7B5BD6" stroke-width="2"/>
<text x="175" y="592" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2933">NE555 · 3 脚 OUT</text>
<text x="175" y="615" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">12V 方波 ≈100Hz</text>
<text x="175" y="636" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">8/4 脚接 12V（详见终版图）</text>
<line x1="290" y1="605" x2="344" y2="605" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="344" y1="590" x2="344" y2="620" stroke="#7B5BD6" stroke-width="3" stroke-linecap="round"/>
<line x1="356" y1="590" x2="356" y2="620" stroke="#7B5BD6" stroke-width="3" stroke-linecap="round"/>
<text x="350" y="578" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#7B5BD6">100pF 微分</text>
<line x1="356" y1="605" x2="430" y2="605" stroke="#7B5BD6" stroke-width="2.5"/>
<circle cx="430" cy="605" r="4.5" fill="#7B5BD6"/>
<line x1="430" y1="605" x2="560" y2="605" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="430" y1="605" x2="430" y2="630" stroke="#7B5BD6" stroke-width="2"/>
<rect x="418" y="630" width="24" height="56" fill="#FFFFFF" stroke="#7B5BD6" stroke-width="2"/>
<line x1="430" y1="686" x2="430" y2="710" stroke="#7B5BD6" stroke-width="2"/>
<use href="#gnd" x="430" y="710"/>
<text x="452" y="665" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#7B5BD6">10kΩ 下拉到 GND</text>

<!-- ========== 底部：实物脚位与要点 ========== -->
<rect x="40" y="745" width="1320" height="225" rx="10" fill="#F7F9FB" stroke="#D6DEE5" stroke-width="1.5"/>
<text x="60" y="775" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2933">实物脚位对照 · 印字面朝自己、引脚朝下</text>
<text x="400" y="775" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B03030">⚠ 与常见 TO-92（E-B-C）相反，别凭习惯插</text>

<rect x="80" y="790" width="170" height="78" rx="10" fill="#2F3A45" stroke="#1F2933" stroke-width="1.5"/>
<circle cx="96" cy="804" r="4" fill="#6B7884"/>
<text x="165" y="832" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">ZTX415</text>
<text x="165" y="852" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#B9C2CA">flat face / 印字面</text>
<line x1="115" y1="868" x2="115" y2="898" stroke="#B9C2CA" stroke-width="7" stroke-linecap="round"/>
<line x1="165" y1="868" x2="165" y2="898" stroke="#B9C2CA" stroke-width="7" stroke-linecap="round"/>
<line x1="215" y1="868" x2="215" y2="898" stroke="#B9C2CA" stroke-width="7" stroke-linecap="round"/>
<text x="115" y="914" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">1</text>
<text x="165" y="914" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">2</text>
<text x="215" y="914" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">3</text>
<text x="115" y="940" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#D64545">C</text>
<text x="165" y="940" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#7B5BD6">B</text>
<text x="215" y="940" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E9E6A">E</text>
<text x="165" y="958" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#5B6770">左　中　右</text>

<text x="290" y="805" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">① 上电前验脚位：万用表二极管档，红笔固定一脚、黑笔碰另两脚都读 0.60–0.70V ⇒ 该脚是 B，且应在中间。</text>
<text x="290" y="832" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B03030">② B/C 焊反 = 高压直灌基极、管子报废；C/E 焊反 = 不起振或发热。丝印模糊一律以实测为准。</text>
<text x="290" y="859" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">③ 高压 200V 起步 → 不出脉冲先加强触发（100pF→470pF、10kΩ→1kΩ）→ 250V 封顶；50Hz 档 = 两颗 104 并联。</text>
<text x="290" y="886" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">④ 高压区用洞洞板焊接、不插面包板；断电确认 HV &lt; 5V 才装 / 拆管；所有 ⏚ 星形汇到 12V 适配器负极。</text>
<text x="290" y="913" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">V0 验源（100Hz）：量 47kΩ 两端压降，未雪崩 ≈1V → 反复雪崩 ≈10V；先 1000V 档确认差压，再切 20V 档读准。</text>
<text x="290" y="940" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">颜色：红 = 200–250V 高压　橙 = 12V　紫 = 触发　绿 = 雪崩输出　灰 = GND　｜　● 实心圆点 = 相连，本图零交叉。</text>
</svg>
