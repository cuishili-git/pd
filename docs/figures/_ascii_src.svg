<text x="366" y="348" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#7B5BD6">100pF 微分</text>
<circle cx="395" cy="372" r="4" fill="#7B5BD6"/>

<!-- 10kΩ 下拉（B 节点对地） -->
<line x1="395" y1="372" x2="395" y2="400" stroke="#7B5BD6" stroke-width="2"/>
<rect x="383" y="400" width="24" height="48" fill="#FFFFFF" stroke="#7B5BD6" stroke-width="2"/>
<line x1="395" y1="448" x2="395" y2="478" stroke="#7B5BD6" stroke-width="2"/>
<use href="#gnd" x="395" y="478"/>
<text x="379" y="428" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">10kΩ 下拉</text>

<!-- 触发线：先右、再低位横穿、再上行接 B 脚 -->
<line x1="395" y1="372" x2="455" y2="372" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="455" y1="372" x2="455" y2="628" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="455" y1="628" x2="940" y2="628" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="940" y1="628" x2="940" y2="380" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="940" y1="380" x2="950" y2="380" stroke="#7B5BD6" stroke-width="2.5"/>
<text x="700" y="620" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#7B5BD6">触发线刻意走低位：与 200–250V 高压线拉开距离，实物布线同样别平行贴着走</text>

<!-- ① 区提示框 -->
<rect x="60" y="520" width="370" height="128" rx="8" fill="#FFFFFF" stroke="#F0D6B4"/>
<text x="76" y="542" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B4650A">NE555 模块两大坑（2026-11-17 核对实物）</text>
<text x="76" y="562" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">① 内置 7805 的模块：供 12V 只出 5V → OUT 直流 5V，</text>
<text x="76" y="578" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">　　触发尖峰从 12V 掉到 5V，点火变难（改 100pF→470pF）</text>
<text x="76" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">② 模块 GND 必须与高压区共地，否则 OUT 有方波</text>
<text x="76" y="614" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">　　但管子永不点火（最隐蔽的坑）</text>
<text x="76" y="638" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B4650A">Step1 判据：OUT 对 GND 直流 ≈5~6V ⇒ 已起振</text>

<!-- ============ 高压充电级 ============ -->
<rect x="515" y="155" width="225" height="72" rx="8" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<text x="627" y="184" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2933">45–390V 升压模块</text>
<text x="627" y="206" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B03030">空载调 200V 起步，250V 封顶</text>

<line x1="740" y1="191" x2="768" y2="191" stroke="#D64545" stroke-width="2.5"/>
<line x1="768" y1="191" x2="768" y2="215" stroke="#D64545" stroke-width="2.5"/>

<!-- 47kΩ 位：5 × 9.1kΩ / 3W 串联 -->
<rect x="758" y="215" width="20" height="22" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="768" y1="237" x2="768" y2="247" stroke="#D64545" stroke-width="2.5"/>
<rect x="758" y="247" width="20" height="22" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="768" y1="269" x2="768" y2="279" stroke="#D64545" stroke-width="2.5"/>
<rect x="758" y="279" width="20" height="22" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="768" y1="301" x2="768" y2="311" stroke="#D64545" stroke-width="2.5"/>
<rect x="758" y="311" width="20" height="22" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="768" y1="333" x2="768" y2="343" stroke="#D64545" stroke-width="2.5"/>
<rect x="758" y="343" width="20" height="22" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="768" y1="365" x2="768" y2="395" stroke="#D64545" stroke-width="2.5"/>
<circle cx="768" cy="395" r="4" fill="#D64545"/>

<text x="752" y="280" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">5 × 9.1kΩ / 3W</text>
<text x="752" y="296" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">= 45.5kΩ（限流 / 淬灭）</text>
<text x="752" y="312" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">备选 4 × 12kΩ = 48kΩ</text>
<text x="752" y="328" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">单颗 47kΩ 也行（正常工况）</text>

<!-- T 节点水平线 → 上升接 C 脚 -->
<line x1="768" y1="395" x2="920" y2="395" stroke="#D64545" stroke-width="2.5"/>
<line x1="920" y1="395" x2="920" y2="300" stroke="#D64545" stroke-width="2.5"/>
<line x1="920" y1="300" x2="950" y2="300" stroke="#D64545" stroke-width="2.5"/>
<text x="800" y="384" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">T 节点 ≈190V</text>

<!-- 10nF 储能 -->
<circle cx="820" cy="395" r="3.5" fill="#D64545"/>
<line x1="820" y1="395" x2="820" y2="435" stroke="#D64545" stroke-width="2"/>
