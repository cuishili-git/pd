<text x="640" y="46" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F2933">雪崩脉冲源 · 完整接线图（NE555 模块版 · 100 Hz）</text>
<text x="640" y="74" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6770">ZTX415 ＋ 45–390V 模块（调至 200V 起步）＋ NE555 集成模块（板载定时）｜12V 适配器直供｜2026-11-18</text>

<!-- ============ 分区底框 ============ -->
<rect x="40" y="100" width="430" height="560" rx="12" fill="#FFF9F2" stroke="#F0D6B4" stroke-width="1.5"/>
<text x="60" y="128" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#B4650A">① 低压 / 触发链（12V，面包板可放）</text>

<rect x="490" y="100" width="400" height="560" rx="12" fill="#FFF4F4" stroke="#F0CACA" stroke-width="1.5"/>
<text x="510" y="128" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#B03030">② 高压充电级（200–250V，洞洞板焊接）</text>

<rect x="910" y="100" width="330" height="560" rx="12" fill="#F4F9FF" stroke="#C9DCF0" stroke-width="1.5"/>
<text x="930" y="128" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D5FA8">③ 雪崩级 / 输出</text>

<!-- ============ 12V 供电 ============ -->
<rect x="80" y="158" width="150" height="62" rx="8" fill="#FFFFFF" stroke="#E8871A" stroke-width="2"/>
<text x="155" y="184" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2933">12V 适配器</text>
<text x="155" y="206" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">5.5×2.1 中心正极</text>

<!-- 12V 母线 -->
<line x1="155" y1="220" x2="155" y2="258" stroke="#E8871A" stroke-width="2.5"/>
<line x1="155" y1="258" x2="200" y2="258" stroke="#E8871A" stroke-width="2.5"/>
<line x1="200" y1="258" x2="200" y2="300" stroke="#E8871A" stroke-width="2.5"/>
<text x="163" y="250" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B4650A">12V</text>

<!-- NE555 集成模块 -->
<rect x="150" y="300" width="185" height="145" rx="8" fill="#FFFFFF" stroke="#B4650A" stroke-width="2"/>
<text x="242" y="326" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">NE555 模块</text>
<text x="242" y="346" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">集成式 · 只有三根线</text>
<text x="242" y="365" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#5B6770">板载 R1/R2/Ct + 频率电位器</text>
<text x="242" y="384" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#B4650A">频率 ≈100Hz（电位器可调）</text>
<text x="242" y="410" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#5B6770">→ 100Hz 档：板载 Ct 选 100nF</text>
<!-- 频率电位器小旋钮 -->
<circle cx="310" cy="404" r="9" fill="#FFF9F2" stroke="#B4650A" stroke-width="1.5"/>
<line x1="310" y1="404" x2="310" y2="397" stroke="#B4650A" stroke-width="1.5"/>
<text x="200" y="308" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B4650A">VCC</text>
<text x="200" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B4650A">GND</text>
<text x="330" y="378" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#7B5BD6">OUT</text>

<!-- 模块 GND 下地 -->
<line x1="200" y1="445" x2="200" y2="478" stroke="#E8871A" stroke-width="2"/>
<use href="#gnd" x="200" y="478"/>

<!-- ============ 触发链（紫） ============ -->
<line x1="335" y1="372" x2="360" y2="372" stroke="#7B5BD6" stroke-width="2.5"/>
<line x1="360" y1="358" x2="360" y2="386" stroke="#7B5BD6" stroke-width="3" stroke-linecap="round"/>
