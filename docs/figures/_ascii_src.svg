<line x1="808" y1="447" x2="832" y2="447" stroke="#D64545" stroke-width="3" stroke-linecap="round"/>
<line x1="820" y1="452" x2="820" y2="472" stroke="#D64545" stroke-width="2"/>
<use href="#gnd" x="820" y="472"/>
<text x="820" y="500" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">10nF / 1kV</text>
<text x="820" y="516" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">(103) 储能</text>

<!-- 10MΩ 位：2 × 5.1MΩ 串联 -->
<circle cx="880" cy="395" r="3.5" fill="#D64545"/>
<line x1="880" y1="395" x2="880" y2="425" stroke="#D64545" stroke-width="2"/>
<rect x="868" y="425" width="24" height="26" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="880" y1="451" x2="880" y2="459" stroke="#D64545" stroke-width="2"/>
<rect x="868" y="459" width="24" height="26" fill="#FFFFFF" stroke="#D64545" stroke-width="2"/>
<line x1="880" y1="485" x2="880" y2="505" stroke="#D64545" stroke-width="2"/>
<use href="#gnd" x="880" y="505"/>
<text x="880" y="533" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">2 × 5.1MΩ</text>
<text x="880" y="549" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">泄放（全程常接）</text>

<!-- 高压安全框 -->
<rect x="520" y="560" width="350" height="80" rx="8" fill="#FFFFFF" stroke="#F0CACA"/>
<text x="536" y="582" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B03030">⚠ 200–250V 不上面包板（普通面包板额定约 250V）</text>
<text x="536" y="602" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">洞洞板焊接或引脚架空，相邻高压节点爬电 ≥3mm</text>
<text x="536" y="620" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">5 只 9.1kΩ 逐颗套热缩管、彼此架空，不要贴地排</text>
<text x="536" y="638" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">断电后确认 HV &lt; 5V 才允许装 / 拆 ZTX415</text>

<!-- ============ 雪崩级 ============ -->
<text x="938" y="304" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#B03030">C</text>
<text x="938" y="384" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#7B5BD6">B</text>
<rect x="950" y="270" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1D5FA8" stroke-width="2"/>
<text x="1045" y="310" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">ZTX415</text>
<text x="1045" y="334" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#5B6770">雪崩管 · E-Line 封装</text>
<text x="1045" y="357" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">左 C · 中 B · 右 E</text>
<text x="1045" y="378" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">印字面朝自己、引脚朝下</text>
<text x="1045" y="398" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#5B6770">焊前用二极管档验脚位</text>

<text x="1152" y="348" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E9E6A">E</text>
<line x1="1140" y1="355" x2="1180" y2="355" stroke="#1E9E6A" stroke-width="2.5"/>
<circle cx="1180" cy="355" r="4" fill="#1E9E6A"/>

<!-- 50Ω 负载 -->
<line x1="1180" y1="355" x2="1180" y2="395" stroke="#1E9E6A" stroke-width="2"/>
<rect x="1168" y="395" width="24" height="52" fill="#FFFFFF" stroke="#1E9E6A" stroke-width="2"/>
<line x1="1180" y1="447" x2="1180" y2="467" stroke="#1E9E6A" stroke-width="2"/>
<use href="#gnd" x="1180" y="467"/>
<text x="1160" y="424" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">50Ω 负载</text>

<!-- 天线 -->
<polyline points="1180,355 1210,325 1238,295" fill="none" stroke="#1E9E6A" stroke-width="2.5" stroke-linejoin="round"/>
<text x="1236" y="282" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1E9E6A">~10cm 硬导线（天线）</text>

<!-- V0 验源判据 -->
<rect x="950" y="500" width="285" height="112" rx="8" fill="#FFFFFF" stroke="#C9DCF0"/>
<text x="966" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#1D5FA8">V0 验源判据（不接射频设备）</text>
<text x="966" y="546" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">量 47kΩ 串两端直流压降：</text>
<text x="966" y="566" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#1F2933">未雪崩 ≈1V（10MΩ 泄放仅 20µA）</text>
<text x="966" y="586" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">反复雪崩 → 跳到 ≈10V（100Hz）</text>
<text x="966" y="604" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">跳变 ≈10 倍；1000V 档确认后切 20V 档读准</text>

<!-- ============ 底部说明 ============ -->
<rect x="40" y="700" width="1200" height="150" rx="10" fill="#F7F9FB" stroke="#D6DEE5" stroke-width="1.5"/>
<rect x="60" y="716" width="14" height="12" fill="#D64545"/><text x="80" y="727" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">高压</text>
<rect x="140" y="716" width="14" height="12" fill="#E8871A"/><text x="160" y="727" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">12V 低压</text>
<rect x="240" y="716" width="14" height="12" fill="#7B5BD6"/><text x="260" y="727" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">触发</text>
<rect x="320" y="716" width="14" height="12" fill="#1E9E6A"/><text x="340" y="727" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">雪崩输出</text>
<rect x="430" y="716" width="14" height="12" fill="#8A98A3"/><text x="450" y="727" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">GND</text>
<text x="520" y="727" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">● 实心圆点 = 相连；本图做到零交叉，交叉即不相连</text>

<text x="60" y="756" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#B03030">共地（最易错）：所有 ⏚ 符号必须用导线汇到同一点 —— 12V 适配器负极。高压模块 GND、NE555 模块 GND、10nF、10MΩ×2、10kΩ、50Ω 全接这里。</text>
<text x="60" y="778" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">本轮 V0：XL6009、UF4007 不接；NE555 用集成模块（板载定时）；47kΩ 位串 5×9.1kΩ/3W（或 4×12kΩ）；10MΩ 位串 2×5.1MΩ。</text>
<text x="60" y="800" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#1F2933">验源判据：47kΩ 串两端直流压降，静态 ≈1V → 反复雪崩 ≈10V（跳变 10 倍）＝ 已经点着火了。</text>
<text x="60" y="822" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#B03030">安全：红表笔插 VΩ 孔（插 A 孔量 200–250V = 直接短路）；单手操作；鳄鱼夹先夹稳再上电；禁止用螺丝刀短路放电。</text>
<text x="60" y="840" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#5B6770">焊前必做：ZTX415 用万用表二极管档验脚位（两次都读 ≈0.6V 的那只脚是 B）；储能电容认「103 + 1KV」，定时电容认「104」，两颗别拿混。</text>
</svg>
