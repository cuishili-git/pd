<text x="120.375" y="310" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9A8ABE">10pF：0.3µs 就没了</text>
<rect x="90" y="415" width="810" height="70" rx="8" fill="#F7F9FB" stroke="#D6DEE5"/>
<text x="106" y="437" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2933">取值边界：太小 → 注入电荷不足点不着火；太大 → B-E 长时间导通、负尖峰能量涨 100 倍</text>
<text x="106" y="457" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6770">100pF：τ=1µs、Q=1.2nC、½CV²=7.2nJ　｜　470pF：τ=4.7µs、Q=5.64nC、½CV²=33.8nJ（点火失败时换）</text>
<text x="106" y="477" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6770">与重复频率无关：微分只看方波边沿。1kHz → 100Hz 只换定时电容 Ct，这颗不动。</text>
